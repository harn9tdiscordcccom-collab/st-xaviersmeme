
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MemeHub 😂</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #111827;
  color: white;
}
header {
  background: #7c3aed;
  padding: 25px;
  text-align: center;
}
header h1 { margin: 0; font-size: 35px; }
nav {
  display: flex;
  justify-content: center;
  gap: 20px;
  padding: 18px;
  background: #1f2937;
}
nav a { color: white; text-decoration: none; }
main { max-width: 900px; margin: 30px auto; padding: 15px; }
h2 { color: #facc15; }
.meme {
  background: #1f2937;
  padding: 15px;
  border-radius: 15px;
  margin-bottom: 25px;
}
.meme img {
  width: 100%;
  border-radius: 10px;
}
button {
  background: #7c3aed;
  color: white;
  border: 0;
  padding: 12px 20px;
  border-radius: 8px;
  cursor: pointer;
}
.upload {
  margin-bottom: 25px;
  background: #1f2937;
  padding: 20px;
  border-radius: 12px;
}
input { max-width: 100%; margin: 10px 0; }
</style>
</head>
<body>

<header>
  <h1>😂 MemeHub</h1>
  <p>Share memes. Spread laughter.</p>
</header>

<nav>
  <a href="#">🏠 Home</a>
  <a href="#trending">🔥 Trending</a>
  <a href="#upload">📤 Upload</a>
</nav>

<main>
  <section class="upload" id="upload">
    <h2>Upload Your Meme</h2>
    <input type="text" id="title" placeholder="Meme title">
    <br>
    <input type="file" id="image" accept="image/*">
    <br><br>
    <button onclick="uploadMeme()">Upload Meme</button>
  </section>

  <h2 id="trending">🔥 Latest Memes</h2>
  <div id="memes">
    <div class="meme">
      <img src="https://placehold.co/700x450/7c3aed/ffffff?text=Funny+Meme"
           alt="Funny meme">
      <h3>Welcome to MemeHub 😂</h3>
      <button onclick="likeMeme(this)">❤️ Like</button>
      <span>0 Likes</span>
    </div>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script>
function likeMeme(button) {
  const likes = button.nextElementSibling;
  let count = Number(likes.dataset.count || 0) + 1;
  likes.dataset.count = count;
  likes.textContent = count + " Likes";
}

function uploadMeme() {
  const title = document.getElementById("title").value;
  const file = document.getElementById("image").files[0];

  if (!title || !file) {
    alert("Enter a title and select a meme!");
    return;
  }

  if (!file.type.startsWith("image/")) {
    alert("Please select an image!");
    return;
  }

  const imageURL = URL.createObjectURL(file);
  const card = document.createElement("div");
  card.className = "meme";

  const img = document.createElement("img");
  img.src = imageURL;
  img.alt = title;

  const heading = document.createElement("h3");
  heading.textContent = title;

  const button = document.createElement("button");
  button.textContent = "❤️ Like";
  button.onclick = function() { likeMeme(button); };

  const likes = document.createElement("span");
  likes.textContent = "0 Likes";
  likes.style.marginLeft = "12px";

  card.append(img, heading, button, likes);
  document.getElementById("memes").prepend(card);

  document.getElementById("title").value = "";
  document.getElementById("image").value = "";
}
</script>
</body>
</html>
